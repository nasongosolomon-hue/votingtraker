<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure voting page for the FSD-FT01 Final Project">
    <title>CitizenVote | Cast Your Ballot</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>CitizenVote <span>2026</span></h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="vote.html" class="active">Cast Vote</a></li>
                <li><a href="results.html">Live Results</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-wrapper">
            <header class="section-intro">
                <h2>Voter Ballot</h2>
                <p>Please enter your credentials and select your preferred candidate. Your vote is stored locally and securely.</p>
            </header>

            <form id="votingForm" class="ballot-form">
                
                <div class="form-group">
                    <label for="voterName">Legal Full Name</label>
                    <input 
                        type="text" 
                        id="voterName" 
                        placeholder="e.g. John Doe" 
                        required 
                        minlength="3"
                    >
                </div>

                <div class="form-group">
                    <label for="voterID">Voter ID Number (8 Digits)</label>
                    <input 
                        type="number" 
                        id="voterID" 
                        placeholder="12345678" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="candidateSelect">Select Candidate</label>
                    <select id="candidateSelect" required>
                        <option value="" disabled selected>-- Select a Candidate --</option>
                        <option value="Candidate A">Candidate A - Green Future</option>
                        <option value="Candidate B">Candidate B - Innovation Party</option>
                        <option value="Candidate C">Candidate C - Unity Alliance</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn">Submit Secure Ballot</button>
                    <button type="reset" class="btn-secondary">Clear Form</button>
                </div>
            </form>

            <div id="formFeedback" class="feedback-box hidden">
                <p id="feedbackMessage"></p>
                <a href="results.html" class="btn-link">View Results →</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 CitizenVote Digital Platform. All rights reserved.</p>
        </div>
    </footer>


</body>
</html>
